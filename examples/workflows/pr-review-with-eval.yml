# Example: PR review with a quality gate via agent-eval (claude-code-action).
#
# This is the human-facing companion to the offline worked-example test
# (tests/cca-worked-example.test.ts): a complete, copy-pasteable workflow that
# shows the "Integration mode A" seam from
# docs/claude-code-action-integration.md end to end.
#
#   1. claude-code-action runs autonomously on the PR and writes its run to a
#      JSON execution log, exposed as the `execution_file` step output.
#   2. A *separate, downstream* eval step reads that file and gates on WHAT THE
#      AGENT PRODUCED — not just "did the CLI exit 0?".
#   3. Later steps branch on the eval outputs (`eval_passed`, `eval_score`,
#      `eval_evidence`, ...) without re-running the eval.
#
# The eval is deterministic and offline: two Tier 1 checks — completeness and
# staleness (the no-op detector) — no model-as-judge, no LLM call, no API cost,
# no flake. It catches the failure modes a crash check (exit 0) misses: an empty
# or stub result, an on-topic "looks good to me" with nothing actionable, or a
# run abandoned mid-task.
#
# It composes with the *published* action — no fork of claude-code-action
# required. The eval entry point is examples/cca-execution-eval.ts in this repo.

name: PR review with eval gate

on:
  pull_request:

# claude-code-action needs these to read the PR and post its review.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install agent-eval (here: this repo's own deps so the example is
      # self-contained; in your repo, depend on the published package instead).
      - run: npm ci

      # The task you hand the action. Reuse the SAME text for the eval's
      # reference so the two see the same prompt. (The execution file records the
      # conversation, not the task framing, so the prompt is supplied here.)
      - name: Build the review prompt
        id: prompt
        run: |
          {
            echo 'text<<PROMPT_EOF'
            echo "Review this pull request: ${{ github.event.pull_request.title }}."
            echo "Check correctness, flag race conditions, and verify error handling."
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.prompt.outputs.text }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Gate on what the agent produced. `always()` so a failed/blank run is
      # STILL evaluated (that is the most important case to catch); skip only
      # when no execution file was emitted at all. The step writes the eval
      # outputs + a step summary and exits non-zero when the run did not produce
      # something a human can act on — which fails the job.
      - name: Evaluate the review
        id: eval
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        run: npx tsx examples/cca-execution-eval.ts
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          AGENT_PROMPT: ${{ steps.prompt.outputs.text }}
          # Worst grade that still passes: healthy | watch | at-risk | critical.
          AGENT_EVAL_GATE: watch
          AGENT_EVAL_WORKER: claude-code-action

      # Downstream steps branch on the eval outputs without re-running it. This
      # one runs only when the eval ran AND it failed — e.g. to nudge a human to
      # take over a stale / no-op review.
      - name: Flag a low-quality review
        if: ${{ always() && steps.eval.outcome != 'skipped' && steps.eval.outputs.eval_passed == 'false' }}
        run: |
          echo "::warning::Agent review did not pass the quality gate: ${{ steps.eval.outputs.eval_headline }}"
          echo "Score:    ${{ steps.eval.outputs.eval_score }}"
          echo "Evidence: ${{ steps.eval.outputs.eval_evidence }}"
